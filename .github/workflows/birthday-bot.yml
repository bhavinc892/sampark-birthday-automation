# Runs the birthday job once per schedule (GitHub-hosted runner; no long-lived process).
# 9:00 AM Asia/Kolkata = 03:30 UTC (IST is UTC+5:30, no DST).
name: Birthday bot

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: birthday-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Updated to Node.js 24
          cache: npm

      - name: Set environment variable for Node.js 24
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run birthday job
        env:
          SAMPARK_USERNAME: ${{ secrets.SAMPARK_USERNAME }}
          SAMPARK_PASSWORD: ${{ secrets.SAMPARK_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: node birthdayBot.js
